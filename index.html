<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A multilingual fixed-price mobility and transfer platform for Antalya.">
  <title>Waygo Transfer â€” Project showcase</title>
  <style>
    :root { color-scheme: light dark; --ink: #1c1c1a; --paper: #f2ebdd; --accent: #8a63ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ink); color: var(--paper); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: clamp(28px, 6vw, 76px) 0; }
    header { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; margin-bottom: 28px; }
    .label { margin: 0 0 10px; color: var(--accent); font-size: .78rem; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 0; max-width: 760px; font: 500 clamp(2.5rem, 7vw, 5.6rem)/.94 Georgia, serif; letter-spacing: -.05em; }
    p { max-width: 660px; color: #d8d0c2; font-size: clamp(1rem, 2vw, 1.18rem); line-height: 1.65; }
    a { display: inline-flex; min-height: 46px; align-items: center; padding: 0 20px; border-radius: 999px; background: var(--accent); color: #111; font-weight: 750; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--paper); outline-offset: 4px; }
    figure { margin: 0; overflow: hidden; border: 1px solid #4a4842; border-radius: 18px; background: #262623; box-shadow: 0 30px 80px #0007; }
    img { display: block; width: 100%; height: auto; }
    footer { margin-top: 20px; color: #aaa296; font-size: .86rem; }
    @media (max-width: 700px) { header { grid-template-columns: 1fr; align-items: start; } h1 { max-width: 12ch; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="label">SELECTED WORK Â· LIVE PRODUCT</div>
        <h1>Waygo Transfer</h1>
        <p>A multilingual fixed-price mobility and transfer platform for Antalya.</p>
      </div>
      <a href="https://waygotransfer.com" rel="noreferrer">Visit live website</a>
    </header>
    <figure><img src="assets/hero.webp" alt="Waygo Transfer shown on desktop and mobile"></figure>
    <footer>Presentation repository Â· Application source is not included.</footer>
  </main>
</body>
</html>
